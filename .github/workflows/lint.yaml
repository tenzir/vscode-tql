name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lefthook:
    name: Lefthook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate Lefthook config
        run: npm run lefthook:validate

      - name: Run Lefthook
        run: npm run lint
